name: bubblewatch-daily

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bubblewatch-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      - name: run pipeline
        run: python -m bubblewatch.pipeline run

      - name: commit fresh data + site
        run: |
          git config user.name "bubblewatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs web
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "daily run $(date -u '+%F-%H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    needs: run
    if: ${{ !cancelled() && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

